name: Build & Deploy to Infomaniak

on:
  push:
    branches:
      - deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: infomaniak

    # Throwaway database for the tests (credentials match .env.test)
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: test
          MARIADB_DATABASE: eportfolio_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Build ───────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Stops the deploy before anything is touched on the server
      - name: Test
        run: npm test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: test
          DB_NAME: eportfolio_test

      - name: Build
        run: npm run build

      # Upload bundle (Infomaniak runs `node index.js` from REMOTE_PATH):
      #   index.js      self-reloading launcher (deploy/launcher.js)
      #   package.json  minimal ESM package (deploy/package.json)
      #   app/          SvelteKit adapter-node output + production node_modules
      - name: Prepare deploy bundle
        run: |
          test -f build/index.js || { echo "build/index.js missing, deployment aborted"; exit 1; }
          mkdir -p dist/app
          cp -r build/. dist/app/
          cp deploy/launcher.js dist/index.js
          cp deploy/package.json dist/package.json
          # adapter-node leaves `dependencies` (mariadb) external: ship them
          cp package.json package-lock.json dist/app/
          (cd dist/app && npm ci --omit=dev --ignore-scripts)

      # ── 3. Ensure remote folder exists ──────────────────────────────
      - name: Ensure remote folder exists
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
          sshpass -p "${{ secrets.FTP_PASSWORD }}" ssh -o StrictHostKeyChecking=no \
            ${{ secrets.FTP_USERNAME }}@${{ secrets.FTP_SERVER }} \
            "mkdir -p ${{ vars.REMOTE_PATH }}"

      # ── 4. Clean remote folder content via SSH (password auth) ────
      # Removes only the CONTENT of the folder, not the folder itself
      - name: Clean remote folder
        run: |
          sshpass -p "${{ secrets.FTP_PASSWORD }}" ssh -o StrictHostKeyChecking=no \
            ${{ secrets.FTP_USERNAME }}@${{ secrets.FTP_SERVER }} \
            "rm -rf ${{ vars.REMOTE_PATH }}/*"

      # ── 5. Deploy via SFTP (password auth) ─────────────────────────
      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local_path: './dist/*'
          remote_path: ${{ vars.REMOTE_PATH }}/
          sftp_only: true

      # ── 6. Restart the app ─────────────────────────────────────────
      # Infomaniak has no restart API: the launcher (index.js) watches this
      # marker and restarts the server once all files are uploaded.
      - name: Restart app
        run: |
          sshpass -p "${{ secrets.FTP_PASSWORD }}" ssh -o StrictHostKeyChecking=no \
            ${{ secrets.FTP_USERNAME }}@${{ secrets.FTP_SERVER }} \
            "date -u +%FT%TZ > ${{ vars.REMOTE_PATH }}/.deploy-version"